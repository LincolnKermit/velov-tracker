<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vélo'v Tracker Lyon — Disponibilité en temps réel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚲</text></svg>">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="app-header">
        <h1>🚲 Vélo'v Tracker Lyon</h1>
        <div class="live-indicator">
            <span class="pulse-dot"></span>
            <span id="header-status">Direct</span>
        </div>
    </div>

    <!-- Geolocation Button (Apple Maps style) -->
    <button id="locate-btn" type="button" onclick="locateUser()" title="Localiser ma position" aria-label="Localiser ma position">
        <svg id="locate-icon" viewBox="0 0 24 24" width="20" height="20">
            <polygon class="arrow-shape" points="3 11 22 2 13 21 11 13 3 11"></polygon>
        </svg>
    </button>

    <!-- Toast message for notifications -->
    <div id="toast-message" class="toast-message" role="status" aria-live="polite"></div>

    <!-- Search Bar (Rounded corners) with integrated Filter Icon -->
    <div id="search-container">
        <div id="search-bar-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
                id="station-search-input" 
                type="text" 
                placeholder="Bellecour, 3012, ..." 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false"
                aria-label="Rechercher une station"
                oninput="onSearchInput(this.value)"
                onkeydown="onSearchKeyDown(event)"
                onfocus="onSearchFocus()"
            >
            <button id="search-clear-btn" type="button" onclick="clearSearch()" title="Effacer la recherche" aria-label="Effacer">
                ✕
            </button>
            <div class="search-divider"></div>
            <button id="search-filter-btn" type="button" onclick="toggleFilterMenu(event)" title="Filtrer les stations" aria-label="Filtrer les stations" aria-expanded="false">
                <svg class="search-filter-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="21" x2="4" y2="14"></line>
                    <line x1="4" y1="10" x2="4" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12" y2="3"></line>
                    <line x1="20" y1="21" x2="20" y2="16"></line>
                    <line x1="20" y1="12" x2="20" y2="3"></line>
                    <line x1="1" y1="14" x2="7" y2="14"></line>
                    <line x1="9" y1="8" x2="15" y2="8"></line>
                    <line x1="17" y1="16" x2="23" y2="16"></line>
                </svg>
                <span id="filter-active-dot" class="filter-active-dot hidden"></span>
            </button>
        </div>
        <div id="search-results-dropdown" class="search-dropdown hidden"></div>
        <div id="filter-dropdown-menu" class="filter-dropdown hidden">
            <div class="filter-dropdown-header">
                <h3>🚲 Filtrer les stations</h3>
                <button type="button" class="filter-close-x-btn" onclick="hideFilterMenu()" title="Fermer">✕</button>
            </div>
            <div class="filter-dropdown-body">
                <label>
                    <input type="radio" name="filter" value="none" checked onchange="applyFilter(this.value)">
                    Toutes les stations
                    <span class="count-badge" id="count-none">-</span>
                </label>
                <label>
                    <input type="radio" name="filter" value="electrical" onchange="applyFilter(this.value)">
                    ⚡ Vélos électriques
                    <span class="count-badge" id="count-electrical">-</span>
                </label>
                <label>
                    <input type="radio" name="filter" value="mechanical" onchange="applyFilter(this.value)">
                    🔧 Vélos mécaniques
                    <span class="count-badge" id="count-mechanical">-</span>
                </label>
                <label>
                    <input type="radio" name="filter" value="stands" onchange="applyFilter(this.value)">
                    🅿️ Places libres
                    <span class="count-badge" id="count-stands">-</span>
                </label>
                <hr>
                <div id="legend">
                    <div><span class="dot" style="background:#16a34a"></span> 5+ vélos dispo</div>
                    <div><span class="dot" style="background:#ea580c"></span> 1–4 vélos dispo</div>
                    <div><span class="dot" style="background:#dc2626"></span> Aucun vélo dispo</div>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // Global state
        let map;
        let markersData = [];
        let allStationsData = [];
        let activeChart = null;
        let activeStationId = null;

        // Initialize Map
        function initMap() {
            map = L.map("map", {
                center: [45.750000, 4.850000],
                zoom: 13,
                zoomControl: true
            });

            // Standard OpenStreetMap tiles (100% free, no API key required)
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            // Tap map to close search dropdown and filter dropdown
            map.on("click", () => {
                hideSearchDropdown();
                hideFilterMenu();
            });

            // Prevent map interactions when touching or scrolling UI controls
            const locateBtnEl = document.getElementById("locate-btn");
            if (locateBtnEl && typeof L !== "undefined" && L.DomEvent) {
                L.DomEvent.disableClickPropagation(locateBtnEl);
                L.DomEvent.disableScrollPropagation(locateBtnEl);
            }

            const searchEl = document.getElementById("search-container");
            if (searchEl && typeof L !== "undefined" && L.DomEvent) {
                L.DomEvent.disableClickPropagation(searchEl);
                L.DomEvent.disableScrollPropagation(searchEl);
            }

            // When user drags map, un-follow user position (like Apple Maps)
            map.on("dragstart", () => {
                isFollowing = false;
                const btn = document.getElementById("locate-btn");
                if (btn && watchId !== null) {
                    btn.classList.remove("active");
                    btn.classList.add("tracking-passive");
                }
            });

            loadStations();
        }

        // Fetch stations from server
        async function loadStations() {
            try {
                const res = await fetch("/api/stations");
                if (!res.ok) throw new Error("Failed to load stations data");
                const data = await res.json();
                
                const stations = data.stations || [];
                allStationsData = stations;
                if (data.timestamp_utc) {
                    const dt = new Date(data.timestamp_utc);
                    document.getElementById("header-status").textContent = 
                        dt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                }

                renderMarkers(stations);
            } catch (err) {
                console.error("Error loading stations:", err);
                document.getElementById("header-status").textContent = "Hors-ligne";
            }
        }

        // Render markers on map
        function renderMarkers(stations) {
            markersData = [];

            stations.forEach(station => {
                if (!station.latitude || !station.longitude) return;

                const bikes = Number(station.bikes || 0);
                const electrical = Number(station.electrical || 0);
                const mechanical = Number(station.mechanical || 0);
                const stands = Number(station.stands || 0);
                const capacity = Number(station.capacity || 0);
                const number = String(station.number);

                let pinColor = "pin-gray";
                if (bikes >= 5) pinColor = "pin-green";
                else if (bikes > 0) pinColor = "pin-orange";
                else pinColor = "pin-red";

                const icon = L.divIcon({
                    className: "custom-div-icon",
                    html: `<div class="station-pin ${pinColor}">${bikes}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14],
                    popupAnchor: [0, -14]
                });

                const marker = L.marker([station.latitude, station.longitude], { icon: icon });

                // Construct popup HTML
                const popupHtml = `
                    <div class="popup-header">
                        <h2>${station.name || 'Station ' + number}</h2>
                        <p class="station-address">${station.address || 'Lyon'}</p>
                    </div>
                    <div class="popup-body">
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value val-elec">${electrical}</div>
                                <div class="stat-label">⚡ Élec</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value val-mech">${mechanical}</div>
                                <div class="stat-label">🔧 Méca</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value val-stands">${stands}</div>
                                <div class="stat-label">🅿️ Libres</div>
                            </div>
                        </div>
                        <div class="station-meta">
                            <span>Capacité : <strong>${capacity}</strong></span>
                            <span>Statut : <strong>${station.status || 'OPEN'}</strong></span>
                        </div>
                        <div class="chart-section">
                            <div class="chart-header">
                                <span class="chart-title">Historique de disponibilité</span>
                                <div class="chart-tabs">
                                    <button class="chart-tab-btn active" onclick="switchChartWindow('${number}', 24, this)">24h</button>
                                    <button class="chart-tab-btn" onclick="switchChartWindow('${number}', 0, this)">Tout</button>
                                </div>
                            </div>
                            <div class="chart-container" id="container-${number}">
                                <div class="chart-loader" id="loader-${number}">Chargement du graphique...</div>
                                <canvas id="chart-${number}" style="display:none;"></canvas>
                            </div>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHtml, { maxWidth: 320 });

                marker.on("popupopen", () => {
                    activeStationId = number;
                    loadStationHistory(number, 24);
                });

                marker.addTo(map);

                markersData.push({
                    marker,
                    electrical,
                    mechanical,
                    stands,
                    bikes
                });
            });

            updateFilterCounts();
        }

        // Update counts in filter box
        function updateFilterCounts() {
            document.getElementById("count-none").textContent = markersData.length;
            document.getElementById("count-electrical").textContent = markersData.filter(m => m.electrical > 0).length;
            document.getElementById("count-mechanical").textContent = markersData.filter(m => m.mechanical > 0).length;
            document.getElementById("count-stands").textContent = markersData.filter(m => m.stands > 0).length;
        }

        // Apply radio filter
        function applyFilter(filterType) {
            markersData.forEach(({ marker, electrical, mechanical, stands }) => {
                let show = true;
                if (filterType === "electrical") show = electrical > 0;
                else if (filterType === "mechanical") show = mechanical > 0;
                else if (filterType === "stands") show = stands > 0;

                const el = marker.getElement();
                if (el) {
                    el.style.display = show ? "block" : "none";
                }
            });

            // Update filter icon active state & indicator dot
            const filterBtn = document.getElementById("search-filter-btn");
            const dot = document.getElementById("filter-active-dot");
            const isFiltered = (filterType !== "none");
            if (filterBtn) {
                filterBtn.classList.toggle("active", isFiltered);
            }
            if (dot) {
                dot.classList.toggle("hidden", !isFiltered);
            }
        }

        // Switch chart window (24h vs All)
        window.switchChartWindow = function(stationId, hours, btn) {
            const container = btn.closest(".chart-tabs");
            if (container) {
                container.querySelectorAll(".chart-tab-btn").forEach(b => b.classList.remove("active"));
            }
            btn.classList.add("active");
            loadStationHistory(stationId, hours);
        };

        // Fetch history and draw Chart.js
        async function loadStationHistory(stationId, hours) {
            const canvas = document.getElementById(`chart-${stationId}`);
            const loader = document.getElementById(`loader-${stationId}`);
            if (!canvas || !loader) return;

            loader.style.display = "flex";
            loader.textContent = "Chargement...";
            canvas.style.display = "none";

            try {
                const url = hours > 0 
                    ? `/api/history/${stationId}?hours=${hours}` 
                    : `/api/history/${stationId}?all=true`;
                
                const res = await fetch(url);
                if (!res.ok) throw new Error("No history available");
                const data = await res.json();
                const history = data.history || [];

                if (history.length === 0) {
                    loader.textContent = "Aucune donnée disponible";
                    return;
                }

                // Prepare Chart.js datasets
                const labels = [];
                const electricalData = [];
                const mechanicalData = [];

                history.forEach(item => {
                    const d = new Date(item.timestamp_utc);
                    const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateStr = d.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
                    labels.push(hours > 0 ? timeStr : `${timeStr} ${dateStr}`);
                    electricalData.push(item.electrical);
                    mechanicalData.push(item.mechanical);
                });

                if (activeChart) {
                    activeChart.destroy();
                }

                loader.style.display = "none";
                canvas.style.display = "block";

                const ctx = canvas.getContext("2d");
                activeChart = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: "Électrique",
                                data: electricalData,
                                borderColor: "#22c55e",
                                backgroundColor: "rgba(34, 197, 94, 0.15)",
                                borderWidth: 2,
                                pointRadius: history.length > 50 ? 0 : 2,
                                tension: 0.2,
                                fill: true
                            },
                            {
                                label: "Mécanique",
                                data: mechanicalData,
                                borderColor: "#f97316",
                                backgroundColor: "rgba(249, 115, 22, 0.15)",
                                borderWidth: 2,
                                pointRadius: history.length > 50 ? 0 : 2,
                                tension: 0.2,
                                fill: true
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            intersect: false,
                            mode: 'index'
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: {
                                    boxWidth: 10,
                                    boxHeight: 10,
                                    color: '#9ca3af',
                                    font: { size: 10 }
                                }
                            },
                            tooltip: {
                                backgroundColor: '#111827',
                                titleColor: '#f9fafb',
                                bodyColor: '#f3f4f6',
                                padding: 8,
                                displayColors: true
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: {
                                    color: '#6b7280',
                                    font: { size: 9 },
                                    maxTicksLimit: 6
                                }
                            },
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: {
                                    color: '#6b7280',
                                    font: { size: 9 },
                                    precision: 0
                                }
                            }
                        }
                    }
                });

            } catch (err) {
                console.error("Error drawing chart:", err);
                loader.textContent = "Erreur lors du chargement de l'historique";
            }
        }

        // Toggle filter dropdown menu from search bar
        function toggleFilterMenu(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById("filter-dropdown-menu");
            const btn = document.getElementById("search-filter-btn");
            if (!menu || !btn) return;

            hideSearchDropdown();

            const isHidden = menu.classList.contains("hidden");
            if (isHidden) {
                menu.classList.remove("hidden");
                btn.classList.add("open");
                btn.setAttribute("aria-expanded", "true");
            } else {
                menu.classList.add("hidden");
                btn.classList.remove("open");
                btn.setAttribute("aria-expanded", "false");
            }
        }

        function hideFilterMenu() {
            const menu = document.getElementById("filter-dropdown-menu");
            const btn = document.getElementById("search-filter-btn");
            if (menu) menu.classList.add("hidden");
            if (btn) {
                btn.classList.remove("open");
                btn.setAttribute("aria-expanded", "false");
            }
        }

        // ==========================================
        // Geolocation & Real-Time Tracking (Apple Maps style)
        // ==========================================
        let userMarker = null;
        let userAccuracyCircle = null;
        let watchId = null;
        let userLocation = null;
        let isFollowing = false;

        function locateUser() {
            if (!navigator.geolocation) {
                showToast("La géolocalisation n'est pas supportée par votre navigateur.");
                return;
            }

            const btn = document.getElementById("locate-btn");

            // If already tracking and we have a location: snap back to user position
            if (userLocation && watchId !== null) {
                isFollowing = true;
                if (btn) {
                    btn.classList.remove("tracking-passive", "loading");
                    btn.classList.add("active");
                }
                const targetZoom = Math.max(map.getZoom(), 16);
                map.flyTo([userLocation.lat, userLocation.lng], targetZoom, {
                    animate: true,
                    duration: 1.0
                });
                return;
            }

            // First time or starting tracking
            if (btn) {
                btn.classList.remove("tracking-passive", "active");
                btn.classList.add("loading");
            }
            isFollowing = true;

            // Fast initial position acquisition
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    handleLocationSuccess(pos, true);
                },
                (err) => {
                    console.warn("Initial position error:", err);
                    if (err.code === 1) { // PERMISSION_DENIED
                        handleLocationError(err);
                    }
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );

            // Real-time continuous position watch
            if (watchId === null) {
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        handleLocationSuccess(pos, false);
                    },
                    (err) => {
                        handleLocationError(err);
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
                );
            }
        }

        function handleLocationSuccess(pos, isInitial) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const accuracy = pos.coords.accuracy;

            const hadLocation = (userLocation !== null);
            userLocation = { lat, lng, accuracy };

            const btn = document.getElementById("locate-btn");
            if (btn) {
                btn.classList.remove("loading");
                if (isFollowing) {
                    btn.classList.remove("tracking-passive");
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                    btn.classList.add("tracking-passive");
                }
            }

            // Create or update marker
            if (!userMarker) {
                const userIcon = L.divIcon({
                    className: 'user-location-wrapper',
                    html: '<div class="user-pulse"></div><div class="user-dot"></div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                userMarker = L.marker([lat, lng], {
                    icon: userIcon,
                    zIndexOffset: 2000,
                    title: "Votre position"
                }).addTo(map);

                userMarker.bindPopup(`
                    <div class="user-popup">
                        <div class="user-popup-title">
                            <span class="user-popup-dot"></span>
                            Votre position actuelle
                        </div>
                        <div class="user-popup-sub">
                            Précision GPS : ±${Math.round(accuracy)} m
                        </div>
                    </div>
                `, { closeButton: false, offset: [0, -10] });

                userAccuracyCircle = L.circle([lat, lng], {
                    radius: accuracy,
                    color: '#007aff',
                    weight: 1.5,
                    opacity: 0.35,
                    fillColor: '#007aff',
                    fillOpacity: 0.1,
                    interactive: false
                }).addTo(map);
            } else {
                userMarker.setLatLng([lat, lng]);
                if (userAccuracyCircle) {
                    userAccuracyCircle.setLatLng([lat, lng]);
                    userAccuracyCircle.setRadius(accuracy);
                }
                const popup = userMarker.getPopup();
                if (popup) {
                    popup.setContent(`
                        <div class="user-popup">
                            <div class="user-popup-title">
                                <span class="user-popup-dot"></span>
                                Votre position actuelle
                            </div>
                            <div class="user-popup-sub">
                                Précision GPS : ±${Math.round(accuracy)} m
                            </div>
                        </div>
                    `);
                }
            }

            // Fly or pan map to position when following
            if (isFollowing) {
                const targetZoom = Math.max(map.getZoom(), 16);
                if (!hadLocation || isInitial) {
                    map.flyTo([lat, lng], targetZoom, {
                        animate: true,
                        duration: 1.2
                    });
                } else {
                    map.panTo([lat, lng], { animate: true, duration: 0.5 });
                }
            }
        }

        function handleLocationError(err) {
            console.error("Geolocation error:", err);
            const btn = document.getElementById("locate-btn");
            if (btn) {
                btn.classList.remove("loading", "active", "tracking-passive");
            }
            isFollowing = false;

            if (err.code === 1) { // PERMISSION_DENIED
                showToast("Veuillez autoriser l'accès à la position dans votre navigateur.");
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
            } else if (err.code === 2) { // POSITION_UNAVAILABLE
                showToast("Signal GPS indisponible pour le moment.");
            } else if (err.code === 3) { // TIMEOUT
                showToast("Délai d'obtention de la position dépassé.");
            }
        }

        function showToast(msg, duration = 3500) {
            const toast = document.getElementById("toast-message");
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add("show");
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove("show");
            }, duration);
        }

        // ==========================================
        // Station Search (Rounded corner search bar)
        // ==========================================
        let highlightedSearchIndex = -1;

        function escapeHtml(text) {
            if (!text) return "";
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function normalizeSearchText(str) {
            if (!str) return "";
            return str.toString()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") // remove accents
                .replace(/[^a-z0-9]/g, " ")       // normalize punctuation
                .replace(/\s+/g, " ")
                .trim();
        }

        function onSearchInput(query) {
            hideFilterMenu();
            const clearBtn = document.getElementById("search-clear-btn");
            if (clearBtn) {
                clearBtn.style.display = query.length > 0 ? "flex" : "none";
            }

            const nq = normalizeSearchText(query);
            if (!nq) {
                hideSearchDropdown();
                return;
            }

            performSearch(nq, query.trim());
        }

        function performSearch(nq, rawQuery) {
            if (!allStationsData || allStationsData.length === 0) return;

            const scored = [];
            for (const s of allStationsData) {
                let score = 0;
                const snum = String(s.number || "");
                const rawName = String(s.name || "");
                const sname = normalizeSearchText(rawName);
                const saddr = normalizeSearchText(s.address || "");
                const cleanName = normalizeSearchText(rawName.replace(/^\d+\s*-\s*/, ""));

                if (snum === rawQuery) {
                    score += 1000;
                } else if (snum.startsWith(nq)) {
                    score += 500;
                } else if (cleanName.startsWith(nq)) {
                    score += 300;
                } else if ((" " + cleanName).includes(" " + nq)) {
                    score += 200;
                } else if (sname.includes(nq)) {
                    score += 100;
                } else if (saddr.includes(nq)) {
                    score += 50;
                }

                if (score > 0) {
                    scored.push({ score, station: s });
                }
            }

            scored.sort((a, b) => b.score - a.score || Number(a.station.number) - Number(b.station.number));
            const results = scored.slice(0, 6).map(item => item.station);
            renderSearchResults(results, rawQuery);
        }

        function renderSearchResults(results, rawQuery) {
            const dropdown = document.getElementById("search-results-dropdown");
            if (!dropdown) return;

            highlightedSearchIndex = -1;

            if (results.length === 0) {
                dropdown.innerHTML = `<div class="search-no-results">Aucune station trouvée pour "${escapeHtml(rawQuery)}"</div>`;
                dropdown.classList.remove("hidden");
                return;
            }

            let html = "";
            results.forEach((station, idx) => {
                const bikes = Number(station.bikes || 0);
                const stands = Number(station.stands || 0);
                const cleanName = String(station.name || "").replace(/^\d+\s*-\s*/, "");

                let badgeClass = "badge-gray";
                let dotColor = "#6b7280";
                if (bikes >= 5) {
                    badgeClass = "badge-green";
                    dotColor = "#16a34a";
                } else if (bikes > 0) {
                    badgeClass = "badge-orange";
                    dotColor = "#ea580c";
                } else {
                    badgeClass = "badge-red";
                    dotColor = "#dc2626";
                }

                html += `
                    <div class="search-result-item" data-index="${idx}" data-number="${escapeHtml(station.number)}" onclick="selectStationByNumber('${escapeHtml(station.number)}')">
                        <div class="search-res-info">
                            <div class="search-res-title">
                                <span class="search-res-num">#${escapeHtml(station.number)}</span>
                                <span class="search-res-name">${escapeHtml(cleanName)}</span>
                            </div>
                            <div class="search-res-address">${escapeHtml(station.address || "")}</div>
                        </div>
                        <div class="search-res-badge ${badgeClass}">
                            <span class="search-res-dot" style="background:${dotColor}"></span>
                            <span class="search-res-bikes">${bikes} vélos</span>
                            <span class="search-res-stands">${stands} pl.</span>
                        </div>
                    </div>
                `;
            });

            dropdown.innerHTML = html;
            dropdown.classList.remove("hidden");
        }

        function hideSearchDropdown() {
            const dropdown = document.getElementById("search-results-dropdown");
            if (dropdown) {
                dropdown.classList.add("hidden");
                highlightedSearchIndex = -1;
            }
        }

        function onSearchFocus() {
            const input = document.getElementById("station-search-input");
            if (input && input.value.trim().length > 0) {
                onSearchInput(input.value);
            }
        }

        function clearSearch() {
            const input = document.getElementById("station-search-input");
            const clearBtn = document.getElementById("search-clear-btn");
            if (input) {
                input.value = "";
                input.focus();
            }
            if (clearBtn) {
                clearBtn.style.display = "none";
            }
            hideSearchDropdown();
        }

        function selectStationByNumber(stationNumber) {
            const stationNumStr = String(stationNumber);
            const item = markersData.find(m => String(m.number) === stationNumStr);
            if (!item) return;

            const s = item.station;
            const input = document.getElementById("station-search-input");
            if (input) {
                input.value = s.name || `Station #${s.number}`;
                const clearBtn = document.getElementById("search-clear-btn");
                if (clearBtn) clearBtn.style.display = "flex";
                input.blur();
            }
            hideSearchDropdown();

            // Fly smoothly to station
            map.flyTo([Number(s.latitude), Number(s.longitude)], 17, {
                animate: true,
                duration: 1.0
            });

            // Open station popup automatically
            setTimeout(() => {
                if (item.marker) {
                    item.marker.openPopup();
                }
            }, 350);
        }

        function onSearchKeyDown(e) {
            const dropdown = document.getElementById("search-results-dropdown");
            if (!dropdown || dropdown.classList.contains("hidden")) {
                if (e.key === "Enter") {
                    onSearchInput(e.target.value);
                }
                return;
            }

            const items = dropdown.querySelectorAll(".search-result-item");
            if (!items || items.length === 0) return;

            if (e.key === "ArrowDown") {
                e.preventDefault();
                highlightedSearchIndex = (highlightedSearchIndex + 1) % items.length;
                updateHighlightedItem(items);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                highlightedSearchIndex = (highlightedSearchIndex - 1 + items.length) % items.length;
                updateHighlightedItem(items);
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (highlightedSearchIndex >= 0 && highlightedSearchIndex < items.length) {
                    const num = items[highlightedSearchIndex].getAttribute("data-number");
                    selectStationByNumber(num);
                } else if (items.length > 0) {
                    const num = items[0].getAttribute("data-number");
                    selectStationByNumber(num);
                }
            } else if (e.key === "Escape") {
                hideSearchDropdown();
                e.target.blur();
            }
        }

        function updateHighlightedItem(items) {
            items.forEach((item, idx) => {
                if (idx === highlightedSearchIndex) {
                    item.classList.add("highlighted");
                    item.scrollIntoView({ block: "nearest" });
                } else {
                    item.classList.remove("highlighted");
                }
            });
        }

        // Dismiss search dropdown and filter menu when clicking outside
        document.addEventListener("click", (e) => {
            const searchContainer = document.getElementById("search-container");
            if (searchContainer && !searchContainer.contains(e.target)) {
                hideSearchDropdown();
                hideFilterMenu();
            }
        });

        // Initialize on DOM ready
        document.addEventListener("DOMContentLoaded", () => {
            initMap();
        });
    </script>
</body>
</html>
